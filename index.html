<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kid Joke Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffd6e0, #c3f0ca, #a8d8f0, #ffeaa7);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: white;
      border-radius: 28px;
      padding: 40px 36px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 12px 40px rgba(0,0,0,0.12);
      text-align: center;
    }

    h1 { font-size: 2.2rem; margin-bottom: 6px; line-height: 1.2; }
    .subtitle { color: #888; font-size: 0.95rem; margin-bottom: 16px; }

    /* Streak banner */
    .streak {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 16px;
      min-height: 28px;
      transition: all 0.3s ease;
    }

    .streak.hot { color: #ff6b9d; animation: popIn 0.4s ease; }
    .streak.cold { color: #bbb; }

    .joke-box {
      min-height: 130px;
      background: #f9f9f9;
      border-radius: 18px;
      padding: 24px 20px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: all 0.3s ease;
    }

    .setup { font-size: 1.25rem; font-weight: 600; color: #333; line-height: 1.4; }

    .punchline {
      font-size: 1.15rem;
      color: #e04f5f;
      font-weight: 700;
      line-height: 1.4;
      animation: popIn 0.35s ease;
    }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      70% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }

    .placeholder { font-size: 1.1rem; color: #bbb; }

    .btn {
      border: none;
      border-radius: 50px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      padding: 14px 28px;
    }

    .btn:active { transform: scale(0.96); }

    .btn-primary {
      background: linear-gradient(135deg, #ff6b9d, #ff8c42);
      color: white;
      box-shadow: 0 4px 18px rgba(255, 107, 157, 0.4);
      width: 100%;
      font-size: 1.15rem;
      padding: 16px;
    }

    .btn-primary:hover {
      box-shadow: 0 6px 22px rgba(255, 107, 157, 0.55);
      transform: translateY(-1px);
    }

    .footer-emoji {
      font-size: 2.5rem;
      margin-bottom: 10px;
      display: block;
      animation: wobble 2s ease-in-out infinite;
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }

    .counter { margin-top: 18px; font-size: 0.85rem; color: #bbb; }

    /* Vote row */
    .vote-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
      animation: popIn 0.3s ease;
    }

    .btn-vote {
      background: #f0f0f0;
      border: 2px solid transparent;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      padding: 10px 18px;
      transition: all 0.15s ease;
      color: #555;
    }

    .btn-vote:hover { transform: scale(1.08); }
    .btn-vote:active { transform: scale(0.95); }
    .btn-vote.up:hover   { background: #d4f5d4; border-color: #4caf50; color: #2e7d32; }
    .btn-vote.down:hover { background: #fdd; border-color: #e57373; color: #c62828; }
    .btn-vote.voted-up   { background: #d4f5d4; border-color: #4caf50; color: #2e7d32; }
    .btn-vote.voted-down { background: #fdd; border-color: #e57373; color: #c62828; }

    /* Tab bar */
    .tabs {
      display: flex;
      gap: 8px;
      margin-top: 28px;
      border-bottom: 2px solid #eee;
    }

    .tab {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      padding: 8px 14px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #bbb;
      cursor: pointer;
      transition: all 0.15s ease;
      border-radius: 8px 8px 0 0;
    }

    .tab:hover { color: #888; }
    .tab.active { color: #ff6b9d; border-bottom-color: #ff6b9d; }

    .tab-panel { display: none; padding-top: 18px; }
    .tab-panel.active { display: block; }

    .liked-list { text-align: left; }

    .joke-item {
      background: #f9f9f9;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 10px;
      font-size: 0.92rem;
    }

    .joke-item .q { font-weight: 600; color: #333; margin-bottom: 4px; }
    .joke-item .a { color: #e04f5f; font-weight: 600; }

    .empty-state { color: #ccc; font-size: 0.95rem; padding: 16px 0; }

    /* Trophy */
    .trophy-wrap { padding: 10px 0 4px; }
    .trophy-icon { font-size: 3rem; display: block; margin-bottom: 8px; }
    .trophy-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: #aaa; margin-bottom: 6px; }
    .trophy-setup { font-size: 1.1rem; font-weight: 700; color: #333; margin-bottom: 6px; }
    .trophy-punchline { font-size: 1rem; color: #e04f5f; font-weight: 700; }
    .trophy-empty { color: #ccc; font-size: 0.95rem; }

    /* Print button */
    .btn-print {
      background: linear-gradient(135deg, #a8d8f0, #7ec8e3);
      color: #1a6a8a;
      border: none;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      padding: 10px 20px;
      margin-top: 14px;
      transition: all 0.15s ease;
    }
    .btn-print:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(126,200,227,0.5); }

    /* Print styles */
    @media print {
      body { background: white; padding: 0; }
      .card { box-shadow: none; max-width: 100%; padding: 20px; }
      .joke-box, .vote-row, .tabs, #mainBtn, .counter, .streak, .footer-emoji,
      #panel-trophy, .btn-print, #tabs { display: none !important; }
      #panel-liked { display: block !important; }
      .joke-item { break-inside: avoid; border: 1px solid #eee; }
      h1 { font-size: 1.6rem; }
      .subtitle { display: none; }
      .print-header { display: block !important; }
    }

    .print-header {
      display: none;
      text-align: center;
      margin-bottom: 16px;
      font-size: 1rem;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="footer-emoji" id="emoji">😄</span>
    <h1>Kid Joke Generator</h1>
    <p class="subtitle">Clean, silly jokes for everyone!</p>

    <div class="streak cold" id="streak"></div>

    <div class="joke-box" id="jokeBox">
      <p class="placeholder">Press the button for a joke!</p>
    </div>

    <div id="voteRow" class="vote-row" style="display:none"></div>

    <button class="btn btn-primary" id="mainBtn" onclick="nextJoke()">Tell me a joke! 🎉</button>

    <p class="counter" id="counter"></p>

    <!-- Tabs -->
    <div class="tabs" id="tabs" style="display:none">
      <button class="tab active" onclick="showTab('liked')">❤️ My Faves</button>
      <button class="tab" onclick="showTab('trophy')">🏆 Funniest</button>
    </div>

    <div id="panel-liked" class="tab-panel active">
      <p class="print-header">My Favorite Jokes</p>
      <div class="liked-list" id="likedList"></div>
      <div id="printBtnWrap" style="display:none; text-align:center">
        <button class="btn-print" onclick="window.print()">🖨️ Print my favorites</button>
      </div>
    </div>

    <div id="panel-trophy" class="tab-panel">
      <div class="trophy-wrap" id="trophyWrap"></div>
    </div>
  </div>

  <script>
    const jokes = [
      { setup: "Why can't Elsa have a balloon?", punchline: "Because she'll let it go!" },
      { setup: "What do you call a sleeping dinosaur?", punchline: "A dino-snore!" },
      { setup: "Why did the scarecrow win an award?", punchline: "Because he was outstanding in his field!" },
      { setup: "What do you call cheese that isn't yours?", punchline: "Nacho cheese!" },
      { setup: "Why did the bicycle fall over?", punchline: "Because it was two-tired!" },
      { setup: "What do you call a fish without eyes?", punchline: "A fsh!" },
      { setup: "How does a penguin build its house?", punchline: "Igloos it together!" },
      { setup: "What do you call a bear with no teeth?", punchline: "A gummy bear!" },
      { setup: "Why did the math book look so sad?", punchline: "Because it had too many problems!" },
      { setup: "What do you get when you cross a snowman and a vampire?", punchline: "Frostbite!" },
      { setup: "Why don't scientists trust atoms?", punchline: "Because they make up everything!" },
      { setup: "What do you call a lazy kangaroo?", punchline: "A pouch potato!" },
      { setup: "Why did the cookie go to the doctor?", punchline: "Because it was feeling crummy!" },
      { setup: "What do elves learn in school?", punchline: "The elf-abet!" },
      { setup: "Why did the tomato turn red?", punchline: "Because it saw the salad dressing!" },
      { setup: "What do you call a dog magician?", punchline: "A labracadabrador!" },
      { setup: "Why can't Cinderella play soccer?", punchline: "Because she always runs away from the ball!" },
      { setup: "What do you call an alligator in a vest?", punchline: "An in-vest-igator!" },
      { setup: "Why did the golfer bring an extra pair of pants?", punchline: "In case he got a hole in one!" },
      { setup: "What do you call a pile of cats?", punchline: "A meow-ntain!" },
      { setup: "Why did the student eat his homework?", punchline: "Because the teacher told him it was a piece of cake!" },
      { setup: "What has four wheels and flies?", punchline: "A garbage truck!" },
      { setup: "Why do cows wear bells?", punchline: "Because their horns don't work!" },
      { setup: "What do you call a fake noodle?", punchline: "An impasta!" },
      { setup: "Why did the banana go to the doctor?", punchline: "Because it wasn't peeling well!" },
      { setup: "What do you call a dinosaur that crashes their car?", punchline: "Tyrannosaurus wrecks!" },
      { setup: "How do you make a tissue dance?", punchline: "You put a little boogie in it!" },
      { setup: "What do you call a boomerang that won't come back?", punchline: "A stick!" },
      { setup: "Why did the teddy bear say no to dessert?", punchline: "Because she was already stuffed!" },
      { setup: "What do you call a cow with no legs?", punchline: "Ground beef!" },
      { setup: "Why did the orange stop rolling down the hill?", punchline: "Because it ran out of juice!" },
      { setup: "What do you call a snowman with a six-pack?", punchline: "An abdominal snowman!" },
      { setup: "Why did the robot go on a diet?", punchline: "Because it had too many bytes!" },
      { setup: "What do you call a pig that does karate?", punchline: "A pork chop!" },
      { setup: "Why did the music teacher need a ladder?", punchline: "To reach the high notes!" },
      { setup: "What do you call a duck that gets all A's?", punchline: "A wise quacker!" },
      { setup: "Why can't a nose be 12 inches long?", punchline: "Because then it would be a foot!" },
      { setup: "What do you call two bananas?", punchline: "A pair of slippers!" },
      { setup: "What do you call a sad strawberry?", punchline: "A blueberry!" },
      { setup: "Why did the clock go to the principal's office?", punchline: "Because it tocked too much!" },
      { setup: "Why did the frog take the bus?", punchline: "Because his car got toad!" },
      { setup: "Why did the tree go to the dentist?", punchline: "To get a root canal!" },
      { setup: "What do you call a funny mountain?", punchline: "Hill-arious!" },
      { setup: "Why did the elephant bring a suitcase to the jungle?", punchline: "Because it had a big trunk!" },
      { setup: "What do you call a cold dog?", punchline: "A chili dog!" },
      { setup: "Why did the astronaut break up with the moon?", punchline: "Because she needed some space!" },
      { setup: "What do you call a superhero who works at a bakery?", punchline: "Bun-man!" },
      { setup: "Why did the broom get promoted?", punchline: "Because it swept the competition!" },
      { setup: "What do you call a fish with no tail?", punchline: "A lost cause!" },
      { setup: "Why did the teddy bear skip lunch?", punchline: "Because she was already stuffed!" },
    ];

    const SKIP_THRESHOLD = 2;

    let state = 'idle';
    let currentJoke = null;
    let currentIdx = null;
    let deck = [];
    let jokeCount = 0;
    let likeStreak = 0;
    const votes = {};
    const downCount = {};

    const emojis = ['😄','🤣','😂','🐸','🦄','🐧','🌈','🎉','🐢','🦊','🎈','🐙'];

    const upLabels = [
      "🤣 That's a knee slapper!",
      "😂 Ha! Got me!",
      "😄 Hehe, good one!",
      "😆 Spit my milk!",
    ];

    const downLabels = [
      "😑 Womp-womp",
      "🥁 ...crickets",
      "🤕 My brain hurts",
      "👎 Booooo!",
    ];

    const streakMessages = [
      '', '', // 0, 1 — no message
      '🔥 2 in a row!',
      '🔥🔥 3 knee-slappers in a row!',
      '🔥🔥🔥 4 in a row — you\'re on fire!',
      '🚀 5 in a row!! Comedy legend!!',
    ];

    // --- Sound effects via Web Audio API ---
    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    const likeSounds = [
      // Classic rimshot: ba-dum-tss
      function() {
        const t = ctx.currentTime;
        // noise hi-hat
        const buf = ctx.createBuffer(1, ctx.sampleRate * 0.05, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
        const src = ctx.createBufferSource(); src.buffer = buf;
        const hpf = ctx.createBiquadFilter(); hpf.type = 'highpass'; hpf.frequency.value = 8000;
        src.connect(hpf);
        // snare
        const snare = ctx.createOscillator(); const snareGain = ctx.createGain();
        snare.frequency.value = 180;
        snareGain.gain.setValueAtTime(0.4, t + 0.12); snareGain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
        snare.connect(snareGain);
        // kick
        const kick = ctx.createOscillator(); const kickGain = ctx.createGain();
        kick.frequency.setValueAtTime(150, t); kick.frequency.exponentialRampToValueAtTime(40, t + 0.1);
        kickGain.gain.setValueAtTime(1, t); kickGain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        kick.connect(kickGain);
        const master = ctx.createGain(); master.gain.value = 0.6;
        hpf.connect(master); snareGain.connect(master); kickGain.connect(master); master.connect(ctx.destination);
        src.start(t); src.stop(t + 0.05);
        snare.start(t + 0.12); snare.stop(t + 0.28);
        kick.start(t); kick.stop(t + 0.2);
      },
      // Ascending "ta-da!" fanfare
      function() {
        const t = ctx.currentTime;
        [[523, 0], [659, 0.12], [784, 0.24], [1047, 0.36]].forEach(([freq, delay]) => {
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          osc.type = 'triangle'; osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.35, t + delay); gain.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.25);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(t + delay); osc.stop(t + delay + 0.25);
        });
      },
      // Bouncy boing
      function() {
        const t = ctx.currentTime;
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, t); osc.frequency.exponentialRampToValueAtTime(900, t + 0.15);
        osc.frequency.exponentialRampToValueAtTime(600, t + 0.3);
        gain.gain.setValueAtTime(0.5, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t + 0.4);
      },
      // Three cheerful pings
      function() {
        const t = ctx.currentTime;
        [880, 1100, 1320].forEach((freq, i) => {
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          osc.type = 'sine'; osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.3, t + i * 0.13); gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.13 + 0.2);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(t + i * 0.13); osc.stop(t + i * 0.13 + 0.2);
        });
      },
    ];

    const dislikeSounds = [
      // Classic womp-womp trombone
      function() {
        const t = ctx.currentTime;
        [0, 0.35, 0.65].forEach((delay, i) => {
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          const startFreq = [220, 185, 155][i]; const endFreq = [185, 155, 110][i];
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(startFreq, t + delay); osc.frequency.linearRampToValueAtTime(endFreq, t + delay + 0.28);
          gain.gain.setValueAtTime(0.25, t + delay); gain.gain.linearRampToValueAtTime(0, t + delay + 0.3);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(t + delay); osc.stop(t + delay + 0.3);
        });
      },
      // Sad descending scale
      function() {
        const t = ctx.currentTime;
        [523, 440, 349, 262].forEach((freq, i) => {
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          osc.type = 'triangle'; osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.3, t + i * 0.15); gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.15 + 0.2);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(t + i * 0.15); osc.stop(t + i * 0.15 + 0.2);
        });
      },
      // Buzzer
      function() {
        const t = ctx.currentTime;
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'sawtooth'; osc.frequency.value = 120;
        gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t + 0.6);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t + 0.6);
      },
      // Deflating balloon
      function() {
        const t = ctx.currentTime;
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(600, t); osc.frequency.exponentialRampToValueAtTime(80, t + 0.7);
        gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0, t + 0.7);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t + 0.7);
      },
    ];

    function playLikeSound()    { pick(likeSounds)(); }
    function playDislikeSound() { pick(dislikeSounds)(); }

    function randomEmoji() {
      return emojis[Math.floor(Math.random() * emojis.length)];
    }

    function isBanned(idx) {
      return (downCount[idx] || 0) >= SKIP_THRESHOLD;
    }

    function buildDeck() {
      const eligible = jokes.map((_, i) => i).filter(i => !isBanned(i));
      for (let i = eligible.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [eligible[i], eligible[j]] = [eligible[j], eligible[i]];
      }
      return eligible;
    }

    function pickJoke() {
      if (deck.length === 0) deck = buildDeck();
      if (deck.length === 0) deck = jokes.map((_, i) => i);
      const idx = deck.shift();
      currentIdx = idx;
      return jokes[idx];
    }

    function updateStreak() {
      const el = document.getElementById('streak');
      if (likeStreak < 2) {
        el.textContent = '';
        el.className = 'streak cold';
      } else {
        const msg = streakMessages[Math.min(likeStreak, streakMessages.length - 1)];
        el.textContent = msg;
        el.className = 'streak hot';
      }
    }

    function vote(dir) {
      const upBtn = document.getElementById('voteUp');
      const downBtn = document.getElementById('voteDown');
      if (upBtn.disabled) return;

      votes[currentIdx] = (votes[currentIdx] || 0) + dir;
      if (dir === -1) {
        downCount[currentIdx] = (downCount[currentIdx] || 0) + 1;
        likeStreak = 0;
        playDislikeSound();
      } else {
        likeStreak++;
        playLikeSound();
      }

      upBtn.disabled = true;
      downBtn.disabled = true;
      if (dir === 1) upBtn.classList.add('voted-up');
      else downBtn.classList.add('voted-down');

      updateStreak();
      renderPanels();
      showTabs();
    }

    function showTab(name) {
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', ['liked','trophy'][i] === name);
      });
      document.getElementById('panel-liked').classList.toggle('active', name === 'liked');
      document.getElementById('panel-trophy').classList.toggle('active', name === 'trophy');
    }

    function showTabs() {
      document.getElementById('tabs').style.display = 'flex';
    }

    function renderPanels() {
      renderLiked();
      renderTrophy();
    }

    function renderLiked() {
      const liked = Object.entries(votes)
        .filter(([, v]) => v > 0)
        .sort(([, a], [, b]) => b - a);

      const el = document.getElementById('likedList');
      const printWrap = document.getElementById('printBtnWrap');

      if (liked.length === 0) {
        el.innerHTML = '<p class="empty-state">Like a joke and it\'ll show up here!</p>';
        printWrap.style.display = 'none';
        return;
      }

      el.innerHTML = liked.map(([idx]) =>
        `<div class="joke-item">
          <div class="q">${jokes[idx].setup}</div>
          <div class="a">${jokes[idx].punchline}</div>
        </div>`
      ).join('');
      printWrap.style.display = 'block';
    }

    function renderTrophy() {
      const el = document.getElementById('trophyWrap');
      const liked = Object.entries(votes).filter(([, v]) => v > 0);
      if (liked.length === 0) {
        el.innerHTML = '<p class="trophy-empty">Rate some jokes to crown a winner!</p>';
        return;
      }
      const [bestIdx] = liked.sort(([, a], [, b]) => b - a)[0];
      el.innerHTML = `
        <span class="trophy-icon">🏆</span>
        <div class="trophy-label">Funniest Joke</div>
        <div class="trophy-setup">${jokes[bestIdx].setup}</div>
        <div class="trophy-punchline">${jokes[bestIdx].punchline}</div>
      `;
    }

    function showVoteRow() {
      const voteRow = document.getElementById('voteRow');
      const already = votes[currentIdx] !== undefined;
      const upLabel = upLabels[Math.floor(Math.random() * upLabels.length)];
      const downLabel = downLabels[Math.floor(Math.random() * downLabels.length)];
      voteRow.style.display = 'flex';
      voteRow.innerHTML = `
        <button id="voteUp" class="btn btn-vote up ${already && votes[currentIdx] > 0 ? 'voted-up' : ''}"
          onclick="vote(1)" ${already ? 'disabled' : ''}>${upLabel}</button>
        <button id="voteDown" class="btn btn-vote down ${already && votes[currentIdx] < 0 ? 'voted-down' : ''}"
          onclick="vote(-1)" ${already ? 'disabled' : ''}>${downLabel}</button>
      `;
    }

    function nextJoke() {
      const box = document.getElementById('jokeBox');
      const btn = document.getElementById('mainBtn');
      const emojiEl = document.getElementById('emoji');
      const voteRow = document.getElementById('voteRow');

      // resume audio context on first interaction (browser requirement)
      if (ctx.state === 'suspended') ctx.resume();

      if (state === 'idle' || state === 'punchline') {
        currentJoke = pickJoke();
        box.innerHTML = `<p class="setup">${currentJoke.setup}</p>`;
        btn.textContent = "🤔 What's the answer?";
        emojiEl.textContent = '🤔';
        voteRow.style.display = 'none';
        state = 'setup';
      } else if (state === 'setup') {
        jokeCount++;
        box.innerHTML = `
          <p class="setup">${currentJoke.setup}</p>
          <p class="punchline">${currentJoke.punchline} 😄</p>
        `;
        btn.textContent = 'Another joke! 🎉';
        emojiEl.textContent = randomEmoji();
        document.getElementById('counter').textContent =
          jokeCount === 1 ? '1 joke told!' : `${jokeCount} jokes told!`;
        showVoteRow();
        state = 'punchline';
      }
    }
  </script>
</body>
</html>
