<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kid Joke Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffd6e0, #c3f0ca, #a8d8f0, #ffeaa7);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      transition: background 0.5s ease;
    }

    body.mode-pirate {
      background: linear-gradient(135deg, #0a1628, #1a3a5c, #0d2b45, #1b2a1b);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
    }

    body.mode-dad {
      background: linear-gradient(135deg, #f5e6d3, #e8c99a, #d4a96a, #f0dcc0);
      background-size: 400% 400%;
      animation: gradientShift 8s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: white;
      border-radius: 28px;
      padding: 40px 36px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 12px 40px rgba(0,0,0,0.12);
      text-align: center;
    }

    /* Mode switcher */
    .mode-switcher {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .mode-btn {
      background: #f0f0f0;
      border: 2px solid transparent;
      border-radius: 50px;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      color: #666;
      transition: all 0.2s ease;
    }

    .mode-btn:hover { background: #e4e4e4; color: #444; }

    .mode-btn.active {
      background: linear-gradient(135deg, #ff6b9d, #ff8c42);
      color: white;
      box-shadow: 0 4px 14px rgba(255,107,157,0.35);
      border-color: transparent;
    }

    /* Pirate mode: gold active button */
    body.mode-pirate .mode-btn.active {
      background: linear-gradient(135deg, #d4a017, #c8860a);
      box-shadow: 0 4px 14px rgba(212,160,23,0.4);
    }

    /* Dad mode: warm brown active button */
    body.mode-dad .mode-btn.active {
      background: linear-gradient(135deg, #8b5e3c, #a0714f);
      box-shadow: 0 4px 14px rgba(139,94,60,0.4);
    }

    h1 { font-size: 2.2rem; margin-bottom: 6px; line-height: 1.2; }
    .subtitle { color: #888; font-size: 0.95rem; margin-bottom: 16px; }

    /* Streak banner */
    .streak {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 16px;
      min-height: 28px;
      transition: all 0.3s ease;
    }

    .streak.hot { color: #ff6b9d; animation: popIn 0.4s ease; }
    .streak.cold { color: #bbb; }

    body.mode-pirate .streak.hot { color: #d4a017; }
    body.mode-dad    .streak.hot { color: #7a4a25; }

    .joke-box {
      min-height: 130px;
      background: #f9f9f9;
      border-radius: 18px;
      padding: 24px 20px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: all 0.3s ease;
    }

    .setup { font-size: 1.25rem; font-weight: 600; color: #333; line-height: 1.4; }

    .punchline {
      font-size: 1.15rem;
      color: #e04f5f;
      font-weight: 700;
      line-height: 1.4;
      animation: popIn 0.35s ease;
    }

    body.mode-pirate .punchline { color: #d4a017; }
    body.mode-dad    .punchline { color: #7a4a25; }

    @keyframes popIn {
      0% { transform: scale(0.7); opacity: 0; }
      70% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }

    .placeholder { font-size: 1.1rem; color: #bbb; }

    .btn {
      border: none;
      border-radius: 50px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      padding: 14px 28px;
    }

    .btn:active { transform: scale(0.96); }

    .btn-primary {
      background: linear-gradient(135deg, #ff6b9d, #ff8c42);
      color: white;
      box-shadow: 0 4px 18px rgba(255, 107, 157, 0.4);
      width: 100%;
      font-size: 1.15rem;
      padding: 16px;
    }

    .btn-primary:hover {
      box-shadow: 0 6px 22px rgba(255, 107, 157, 0.55);
      transform: translateY(-1px);
    }

    body.mode-pirate .btn-primary {
      background: linear-gradient(135deg, #d4a017, #c8860a);
      box-shadow: 0 4px 18px rgba(212,160,23,0.4);
    }
    body.mode-pirate .btn-primary:hover { box-shadow: 0 6px 22px rgba(212,160,23,0.55); }

    body.mode-dad .btn-primary {
      background: linear-gradient(135deg, #8b5e3c, #a0714f);
      box-shadow: 0 4px 18px rgba(139,94,60,0.4);
    }
    body.mode-dad .btn-primary:hover { box-shadow: 0 6px 22px rgba(139,94,60,0.55); }

    .footer-emoji {
      font-size: 2.5rem;
      margin-bottom: 10px;
      display: block;
      animation: wobble 2s ease-in-out infinite;
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }

    .counter { margin-top: 18px; font-size: 0.85rem; color: #bbb; }

    /* Vote row */
    .vote-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
      animation: popIn 0.3s ease;
    }

    .btn-vote {
      background: #f0f0f0;
      border: 2px solid transparent;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      padding: 10px 18px;
      transition: all 0.15s ease;
      color: #555;
    }

    .btn-vote:hover { transform: scale(1.08); }
    .btn-vote:active { transform: scale(0.95); }
    .btn-vote.up:hover   { background: #d4f5d4; border-color: #4caf50; color: #2e7d32; }
    .btn-vote.down:hover { background: #fdd; border-color: #e57373; color: #c62828; }
    .btn-vote.voted-up   { background: #d4f5d4; border-color: #4caf50; color: #2e7d32; }
    .btn-vote.voted-down { background: #fdd; border-color: #e57373; color: #c62828; }

    /* Tab bar */
    .tabs {
      display: flex;
      gap: 8px;
      margin-top: 28px;
      border-bottom: 2px solid #eee;
    }

    .tab {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      padding: 8px 14px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #bbb;
      cursor: pointer;
      transition: all 0.15s ease;
      border-radius: 8px 8px 0 0;
    }

    .tab:hover { color: #888; }
    .tab.active { color: #ff6b9d; border-bottom-color: #ff6b9d; }

    body.mode-pirate .tab.active { color: #d4a017; border-bottom-color: #d4a017; }
    body.mode-dad    .tab.active { color: #7a4a25; border-bottom-color: #7a4a25; }

    .tab-panel { display: none; padding-top: 18px; }
    .tab-panel.active { display: block; }

    .liked-list { text-align: left; }

    .joke-item {
      background: #f9f9f9;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 10px;
      font-size: 0.92rem;
    }

    .joke-item .q { font-weight: 600; color: #333; margin-bottom: 4px; }
    .joke-item .a { color: #e04f5f; font-weight: 600; }

    body.mode-pirate .joke-item .a { color: #d4a017; }
    body.mode-dad    .joke-item .a { color: #7a4a25; }

    .empty-state { color: #ccc; font-size: 0.95rem; padding: 16px 0; }

    /* Trophy */
    .trophy-wrap { padding: 10px 0 4px; }
    .trophy-icon { font-size: 3rem; display: block; margin-bottom: 8px; }
    .trophy-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: #aaa; margin-bottom: 6px; }
    .trophy-setup { font-size: 1.1rem; font-weight: 700; color: #333; margin-bottom: 6px; }
    .trophy-punchline { font-size: 1rem; color: #e04f5f; font-weight: 700; }
    .trophy-empty { color: #ccc; font-size: 0.95rem; }

    body.mode-pirate .trophy-punchline { color: #d4a017; }
    body.mode-dad    .trophy-punchline { color: #7a4a25; }

    /* Print button */
    .btn-print {
      background: linear-gradient(135deg, #a8d8f0, #7ec8e3);
      color: #1a6a8a;
      border: none;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      padding: 10px 20px;
      margin-top: 14px;
      transition: all 0.15s ease;
    }
    .btn-print:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(126,200,227,0.5); }

    /* Print styles */
    @media print {
      body { background: white; padding: 0; }
      .card { box-shadow: none; max-width: 100%; padding: 20px; }
      .joke-box, .vote-row, .tabs, #mainBtn, .counter, .streak, .footer-emoji,
      #panel-trophy, .btn-print, #tabs, .mode-switcher { display: none !important; }
      #panel-liked { display: block !important; }
      .joke-item { break-inside: avoid; border: 1px solid #eee; }
      h1 { font-size: 1.6rem; }
      .subtitle { display: none; }
      .print-header { display: block !important; }
    }

    .print-header {
      display: none;
      text-align: center;
      margin-bottom: 16px;
      font-size: 1rem;
      color: #888;
    }
  </style>
</head>

        for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
        const src = ctx.createBufferSource(); src.buffer = buf;
        const hpf = ctx.createBiquadFilter(); hpf.type = 'highpass'; hpf.frequency.value = 8000;
        src.connect(hpf);
        const snare = ctx.createOscillator(); const snareGain = ctx.createGain();
        snare.frequency.value = 180;
        snareGain.gain.setValueAtTime(0.4, t + 0.12); snareGain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
        snare.connect(snareGain);
        const kick = ctx.createOscillator(); const kickGain = ctx.createGain();
        kick.frequency.setValueAtTime(150, t); kick.frequency.exponentialRampToValueAtTime(40, t + 0.1);
        kickGain.gain.setValueAtTime(1, t); kickGain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        kick.connect(kickGain);
        const master = ctx.createGain(); master.gain.value = 0.6;
        hpf.connect(master); snareGain.connect(master); kickGain.connect(master); master.connect(ctx.destination);
        src.start(t); src.stop(t + 0.05);
        snare.start(t + 0.12); snare.stop(t + 0.28);
        kick.start(t); kick.stop(t + 0.2);
      },
      function() {
        const t = ctx.currentTime;
        [[523, 0], [659, 0.12], [784, 0.24], [1047, 0.36]].forEach(([freq, delay]) => {
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          osc.type = 'triangle'; osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.35, t + delay); gain.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.25);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(t + delay); osc.stop(t + delay + 0.25);
        });
      },
      function() {
        const t = ctx.currentTime;
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, t); osc.frequency.exponentialRampToValueAtTime(900, t + 0.15);
        osc.frequency.exponentialRampToValueAtTime(600, t + 0.3);
        gain.gain.setValueAtTime(0.5, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t + 0.4);
      },
      function() {
        const t = ctx.currentTime;
        [880, 1100, 1320].forEach((freq, i) => {
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          osc.type = 'sine'; osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.3, t + i * 0.13); gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.13 + 0.2);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(t + i * 0.13); osc.stop(t + i * 0.13 + 0.2);
        });
      },
    ];

    const dislikeSounds = [
      function() {
        const t = ctx.currentTime;
        [0, 0.35, 0.65].forEach((delay, i) => {
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          const startFreq = [220, 185, 155][i]; const endFreq = [185, 155, 110][i];
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(startFreq, t + delay); osc.frequency.linearRampToValueAtTime(endFreq, t + delay + 0.28);
          gain.gain.setValueAtTime(0.25, t + delay); gain.gain.linearRampToValueAtTime(0, t + delay + 0.3);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(t + delay); osc.stop(t + delay + 0.3);
        });
      },
      function() {
        const t = ctx.currentTime;
        [523, 440, 349, 262].forEach((freq, i) => {
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          osc.type = 'triangle'; osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.3, t + i * 0.15); gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.15 + 0.2);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(t + i * 0.15); osc.stop(t + i * 0.15 + 0.2);
        });
      },
      function() {
        const t = ctx.currentTime;
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'sawtooth'; osc.frequency.value = 120;
        gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0, t + 0.6);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t + 0.6);
      },
      function() {
        const t = ctx.currentTime;
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(600, t); osc.frequency.exponentialRampToValueAtTime(80, t + 0.7);
        gain.gain.setValueAtTime(0.2, t); gain.gain.linearRampToValueAtTime(0, t + 0.7);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t + 0.7);
      },
    ];

    function playLikeSound()    { pick(likeSounds)(); }
    function playDislikeSound() { pick(dislikeSounds)(); }

    // ── Deck logic ───────────────────────────────────────────────────────────────

    function isBanned(joke) {
      return (downCount[joke.id] || 0) >= SKIP_THRESHOLD;
    }

    function buildDeck() {
      const pool = modeConfig[currentMode].pool();
      const eligible = pool.map((_, i) => i).filter(i => !isBanned(pool[i]));
      for (let i = eligible.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [eligible[i], eligible[j]] = [eligible[j], eligible[i]];
      }
      return eligible;
    }

    function pickJoke() {
      const pool = modeConfig[currentMode].pool();
      if (deck.length === 0) deck = buildDeck();
      if (deck.length === 0) deck = pool.map((_, i) => i);
      const idx = deck.shift();
      return pool[idx];
    }

    // ── Core flow ────────────────────────────────────────────────────────────────

    function startNewJoke() {
      if (ctx.state === 'suspended') ctx.resume();
      currentJoke = pickJoke();
      const box = document.getElementById('jokeBox');
      const btn = document.getElementById('mainBtn');
      const voteRow = document.getElementById('voteRow');
      box.innerHTML = `<p class="setup">${currentJoke.setup}</p>`;
      btn.textContent = '🤔 What\'s the answer?';
      btn.style.display = 'block';
      voteRow.style.display = 'none';
      state = 'setup';
    }

    function revealPunchline() {
      if (state !== 'setup') return;
      if (ctx.state === 'suspended') ctx.resume();
      jokeCount++;
      const box = document.getElementById('jokeBox');
      const btn = document.getElementById('mainBtn');
      const emojiEl = document.getElementById('emoji');
      box.innerHTML = `
        <p class="setup">${currentJoke.setup}</p>
        <p class="punchline">${currentJoke.punchline} 😄</p>
      `;
      btn.style.display = 'none';
      emojiEl.textContent = emojiList[Math.floor(Math.random() * emojiList.length)];
      document.getElementById('counter').textContent =
        jokeCount === 1 ? '1 joke told!' : `${jokeCount} jokes told!`;
      showVoteRow();
      state = 'punchline';
    }

    // ── Voting ───────────────────────────────────────────────────────────────────

    function vote(dir) {
      const upBtn = document.getElementById('voteUp');
      const downBtn = document.getElementById('voteDown');
      if (upBtn.disabled) return;

      votes[currentJoke.id] = (votes[currentJoke.id] || 0) + dir;

      if (dir === -1) {
        downCount[currentJoke.id] = (downCount[currentJoke.id] || 0) + 1;
        likeStreak = 0;
        playDislikeSound();
      } else {
        likeStreak++;
        playLikeSound();
      }

      upBtn.disabled = true;
      downBtn.disabled = true;
      if (dir === 1) upBtn.classList.add('voted-up');
      else downBtn.classList.add('voted-down');

      updateStreak();
      renderPanels();
      showTabs();

      setTimeout(startNewJoke, 1100);
    }

    // ── Streak ───────────────────────────────────────────────────────────────────

    const streakMessages = [
      '', '',
      '🔥 2 in a row!',
      '🔥🔥 3 knee-slappers in a row!',
      '🔥🔥🔥 4 in a row — you\'re on fire!',
      '🚀 5 in a row!! Comedy legend!!',
    ];

    function updateStreak() {
      const el = document.getElementById('streak');
      if (likeStreak < 2) {
        el.textContent = '';
        el.className = 'streak cold';
      } else {
        el.textContent = streakMessages[Math.min(likeStreak, streakMessages.length - 1)];
        el.className = 'streak hot';
      }
    }

    // ── Vote row ─────────────────────────────────────────────────────────────────

    function showVoteRow() {
      const voteRow = document.getElementById('voteRow');
      const already = votes[currentJoke.id] !== undefined;
      const upLabel   = pick(upLabels[currentMode]);
      const downLabel = pick(downLabels[currentMode]);
      voteRow.style.display = 'flex';
      voteRow.innerHTML = `
        <button id="voteUp" class="btn btn-vote up ${already && votes[currentJoke.id] > 0 ? 'voted-up' : ''}"
          onclick="vote(1)" ${already ? 'disabled' : ''}>${upLabel}</button>
        <button id="voteDown" class="btn btn-vote down ${already && votes[currentJoke.id] < 0 ? 'voted-down' : ''}"
          onclick="vote(-1)" ${already ? 'disabled' : ''}>${downLabel}</button>
      `;
    }

    // ── Tabs & panels ────────────────────────────────────────────────────────────

    function showTab(name) {
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', ['liked','trophy'][i] === name);
      });
      document.getElementById('panel-liked').classList.toggle('active', name === 'liked');
      document.getElementById('panel-trophy').classList.toggle('active', name === 'trophy');
    }

    function showTabs() {
      document.getElementById('tabs').style.display = 'flex';
    }

    function renderPanels() {
      renderLiked();
      renderTrophy();
    }

    function renderLiked() {
      const liked = Object.entries(votes)
        .filter(([, v]) => v > 0)
        .sort(([, a], [, b]) => b - a);

      const el = document.getElementById('likedList');
      const printWrap = document.getElementById('printBtnWrap');

      if (liked.length === 0) {
        el.innerHTML = '<p class="empty-state">Like a joke and it\'ll show up here!</p>';
        printWrap.style.display = 'none';
        return;
      }

      el.innerHTML = liked.map(([id]) => {
        const joke = allJokes[id];
        if (!joke) return '';
        return `<div class="joke-item">
          <div class="q">${joke.setup}</div>
          <div class="a">${joke.punchline}</div>
        </div>`;
      }).join('');
      printWrap.style.display = 'block';
    }

    function renderTrophy() {
      const el = document.getElementById('trophyWrap');
      const liked = Object.entries(votes).filter(([, v]) => v > 0);
      if (liked.length === 0) {
        el.innerHTML = '<p class="trophy-empty">Rate some jokes to crown a winner!</p>';
        return;
      }
      const [bestId] = liked.sort(([, a], [, b]) => b - a)[0];
      const best = allJokes[bestId];
      if (!best) return;
      el.innerHTML = `
        <span class="trophy-icon">🏆</span>
        <div class="trophy-label">Funniest Joke</div>
        <div class="trophy-setup">${best.setup}</div>
        <div class="trophy-punchline">${best.punchline}</div>
      `;
    }

    // ── Mode switching ───────────────────────────────────────────────────────────

    function switchMode(mode) {
      if (mode === currentMode) return;
      currentMode = mode;

      // Update body class
      document.body.className = `mode-${mode}`;

      // Update mode buttons
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.id === `btn-mode-${mode}`);
      });

      // Update title and header emoji
      document.getElementById('title').textContent = modeConfig[mode].title;
      document.getElementById('emoji').textContent = modeConfig[mode].emoji;

      // Reset deck and start fresh
      deck = [];
      startNewJoke();
    }

    // ── Init ─────────────────────────────────────────────────────────────────────

    startNewJoke();
  </script>
</body>
</html>
